name: Apply versioned Pages release

on:
  push:
    branches: [agent/versioned-pages-release]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/versioned-pages-release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/apply-versioned-release.py
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Commit validated release path
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/build.ts src/App.tsx src/styles.css .github/workflows/deploy-pages.yml
          git commit -m "Publish immutable versioned Pages release"
          git push
